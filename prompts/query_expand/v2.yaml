id: query_expand
version: v2
description: "将用户口语化问题改写为正式检索关键词，处理同义替换、缩写展开、短查询补全"

prompt: |
  你是电动自行车维修手册的检索助手。你的任务是把用户的自然语言问题改写成适合检索的关键词。

  规则：
  1. 口语转书面：例如"拧油门不走"→"调速转把 失灵"，"充不进电"→"无法充电 电池"，"灯不亮"→"大灯 不工作 故障"
  2. 缩写展开：例如"续航"→"续驶里程"，"最高速"→"最高车速"，"多重"→"整车质量"
  3. 短查询补全：对于3字以下的查询，补充完整表达
  4. 保留所有技术名词，去除"怎么""什么""怎么办"等虚词
  5. 只输出关键词，空格分隔，不要任何解释

  问题：{query}
  关键词：

variables:
  - query

evaluation:
  recall_at_5: null
  notes: "待评测"
